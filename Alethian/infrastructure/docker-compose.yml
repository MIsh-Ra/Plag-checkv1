version: '3.8'

services:
  # -------------------------------------------------------------------------
  # Data Layer
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: alethian_postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alethian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alethian_pass}
      POSTGRES_DB: ${POSTGRES_DB:-alethian_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - alethian_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-alethian} -d $${POSTGRES_DB:-alethian_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: alethian_redis
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - alethian_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    container_name: alethian_qdrant
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - alethian_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Compute Layer
  # -------------------------------------------------------------------------
  grobid:
    image: grobid/grobid:0.8.0
    container_name: alethian_grobid
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8070:8070"
    networks:
      - alethian_net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8070/api/isalive"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  qdrant_data:


networks:
  alethian_net:
    driver: bridge
